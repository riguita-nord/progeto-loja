<section class="app-dashboard" aria-label="Painel">
    <div class="app-slides" aria-live="polite">
        <article class="app-slide active" aria-hidden="false">
            <span class="app-slide-label"><i class="fa fa-lightbulb-o" aria-hidden="true"></i> <span data-i18n="dashboard.slides.0.label"></span></span>
            <h1 data-i18n="dashboard.slides.0.title"></h1>
            <p data-i18n="dashboard.slides.0.description"></p>
            <a class="app-slide-cta" href="#"><span data-i18n="dashboard.slides.0.action"></span> <i class="fa fa-arrow-right" aria-hidden="true"></i></a>
        </article>
        <article class="app-slide" aria-hidden="true">
            <span class="app-slide-label"><i class="fa fa-cubes" aria-hidden="true"></i> <span data-i18n="dashboard.slides.1.label"></span></span>
            <h1 data-i18n="dashboard.slides.1.title"></h1>
            <p data-i18n="dashboard.slides.1.description"></p>
            <a class="app-slide-cta" href="#"><span data-i18n="dashboard.slides.1.action"></span> <i class="fa fa-arrow-right" aria-hidden="true"></i></a>
        </article>
        <article class="app-slide" aria-hidden="true">
            <span class="app-slide-label"><i class="fa fa-users" aria-hidden="true"></i> <span data-i18n="dashboard.slides.2.label"></span></span>
            <h1 data-i18n="dashboard.slides.2.title"></h1>
            <p data-i18n="dashboard.slides.2.description"></p>
            <a class="app-slide-cta" href="#"><span data-i18n="dashboard.slides.2.action"></span> <i class="fa fa-arrow-right" aria-hidden="true"></i></a>
        </article>
    </div>
    <div class="app-slideshow-controls">
        <button class="app-slide-arrow" type="button" data-slide-prev data-i18n-aria-label="dashboard.previous">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
        </button>
        <div class="app-slide-indicators" data-i18n-aria-label="dashboard.chooseSlide">
            <button class="app-slide-indicator active" type="button" data-slide-indicator aria-current="true"></button>
            <button class="app-slide-indicator" type="button" data-slide-indicator aria-current="false"></button>
            <button class="app-slide-indicator" type="button" data-slide-indicator aria-current="false"></button>
        </div>
        <button class="app-slide-arrow" type="button" data-slide-next data-i18n-aria-label="dashboard.next">
            <i class="fa fa-arrow-right" aria-hidden="true"></i>
        </button>
    </div>
</section>
